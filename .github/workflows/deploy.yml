# Compila el aplicativo AQUÍ (runner de GitHub) y sube una imagen ya construida.
# El servidor nunca compila: sólo descarga la imagen. Compilar en la instancia
# agota su memoria.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Frontend ────────────────────────────────────────────────────────
      - name: Instalar dependencias del frontend
        run: npm ci --legacy-peer-deps

      - name: Construir frontend
        env:
          VITE_API_URL: /api   # mismo origen que la API: sin CORS
        run: npm run build

      # ── Backend ─────────────────────────────────────────────────────────
      - name: Instalar dependencias del backend
        working-directory: server
        run: npm ci --legacy-peer-deps

      - name: Compilar backend
        working-directory: server
        run: npm run build

      - name: Verificar artefactos
        run: |
          test -f dist/index.html        || { echo "Falta el build del frontend"; exit 1; }
          test -f server/dist/index.js   || { echo "Falta el build del backend"; exit 1; }
          echo "Frontend: $(du -sh dist | cut -f1)  Backend: $(du -sh server/dist | cut -f1)"

      # ── Imagen ──────────────────────────────────────────────────────────
      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Despliegue ──────────────────────────────────────────────────────
      - name: Desplegar en Coolify
        env:
          COOLIFY_URL:   ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP:   ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "Sin COOLIFY_TOKEN: imagen publicada, despliegue omitido."
            exit 0
          fi
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X GET \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP&force=true" \
            -H "Authorization: Bearer $COOLIFY_TOKEN")
          cat /tmp/deploy.json
          echo
          [ "$code" -lt 300 ] || { echo "Coolify respondió HTTP $code"; exit 1; }
